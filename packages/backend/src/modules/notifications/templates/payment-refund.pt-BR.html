<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Reembolso Processado</title></head>
<body style="font-family:Inter,sans-serif;background:#0B0F19;color:#F9FAFB;padding:32px;">
<div style="max-width:600px;margin:0 auto;background:#111827;border:1px solid #2D3748;border-radius:12px;padding:32px;">
  <div style="text-align:center;margin-bottom:24px;"><span style="font-size:48px;">💰</span></div>
  <h1 style="color:#4F46E5;font-size:24px;margin-bottom:16px;text-align:center;">Reembolso Processado</h1>
  <p style="color:#9CA3AF;margin-bottom:24px;">Olá, {{clientName}}!</p>
  <p>Seu reembolso de <strong>{{amount}}</strong> foi processado com sucesso. O valor será creditado em sua conta em até 5 dias úteis.</p>
  <div style="background:#1F2937;border-radius:8px;padding:16px;margin:24px 0;">
    <p style="margin:4px 0;color:#9CA3AF;font-size:14px;">Motivo: <strong style="color:#F9FAFB;">{{reason}}</strong></p>
    <p style="margin:4px 0;color:#9CA3AF;font-size:14px;">Valor: <strong style="color:#22C55E;">{{amount}}</strong></p>
  </div>
</div>
</body>
</html>
