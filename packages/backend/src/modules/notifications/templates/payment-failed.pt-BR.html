<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Pagamento Falhou</title></head>
<body style="font-family:Inter,sans-serif;background:#0B0F19;color:#F9FAFB;padding:32px;">
<div style="max-width:600px;margin:0 auto;background:#111827;border:1px solid #2D3748;border-radius:12px;padding:32px;">
  <div style="text-align:center;margin-bottom:24px;"><span style="font-size:48px;">❌</span></div>
  <h1 style="color:#EF4444;font-size:24px;margin-bottom:16px;text-align:center;">Pagamento não Processado</h1>
  <p style="color:#9CA3AF;margin-bottom:24px;">Olá, {{clientName}}!</p>
  <p>Infelizmente seu pagamento não pôde ser processado. Tente novamente através do link abaixo:</p>
  <div style="margin:32px 0;text-align:center;">
    <a href="{{retryUrl}}" style="background:#EF4444;color:#fff;text-decoration:none;padding:14px 32px;border-radius:8px;font-weight:600;display:inline-block;">
      Tentar Novamente
    </a>
  </div>
  <p style="color:#6B7280;font-size:14px;">Motivo: {{failureReason}}</p>
</div>
</body>
</html>
